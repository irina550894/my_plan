<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Еженедельный планировщик задач</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="planner-header" aria-label="Навигация по неделям">
        <div class="week-controls">
          <button class="icon-button" id="prevWeek" type="button" aria-label="Предыдущая неделя">
            <span aria-hidden="true">&lt;</span>
          </button>
          <button class="icon-button" id="nextWeek" type="button" aria-label="Следующая неделя">
            <span aria-hidden="true">&gt;</span>
          </button>
        </div>

        <div class="week-summary" aria-live="polite">
          <p class="week-label" id="weekCode">0000-W00</p>
          <h1 id="weekRange">Загрузка...</h1>
        </div>

        <button class="today-button" id="todayButton" type="button">Сегодня</button>
      </header>

      <section class="days-grid" id="daysGrid" aria-label="Дни недели"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
